name: Trigger auto deployment for eh-labels00

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/eh-labels00-AutoDeployTrigger-c985661a-f8b8-4bdd-bc73-52c77c09a51c.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.EHLABELS00_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.EHLABELS00_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.EHLABELS00_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: 
          registryUsername: ${{ secrets.EHLABELS00_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.EHLABELS00_REGISTRY_PASSWORD }}
          containerAppName: eh-labels00
          resourceGroup: eh-labels
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


